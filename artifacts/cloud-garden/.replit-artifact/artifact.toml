kind = "mobile"
previewPath = "/"
title = "Slice & Bloom"
description = "A one-touch physics drawing puzzle: draw ramps, slice wood and ropes, and guide Cloud to a thirsty flower. Includes sixteen levels, hints, bloom particles, sound effects and saved progress."
version = "1.0.0"
id = "artifacts/cloud-garden"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24065

[services.development]
run = "pnpm --filter @workspace/cloud-garden run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cloud-garden", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cloud-garden", "run", "serve" ]

[services.env]
PORT = "24065"
BASE_PATH = "/"
