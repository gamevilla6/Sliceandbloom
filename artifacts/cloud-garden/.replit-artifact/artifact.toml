kind = "mobile"
previewPath = "/"
title = "Slice & Bloom"
description = "A one-touch Matter.js physics puzzle with 355 stages across four independent modes: 100 Campaign beds (including Infinity Cascade 46–100), 100 Hardcore levels, 45 Genesis Gauntlet challenges, and 110 Void Protocol masterclasses. Void has a dark neon red/purple theme, temporary shadow reveals, physically shrinking 1.5-second ink/platform decay, surging hyper-gravity, speed limits, personal leaderboards, death counts and earned badges. Category navigation, independent local records and instant tap/R retry preserve progress across every mode."
version = "1.0.0"
id = "artifacts/cloud-garden"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24065

[services.development]
run = "pnpm --filter @workspace/cloud-garden run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cloud-garden", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cloud-garden", "run", "serve" ]

[services.env]
PORT = "24065"
BASE_PATH = "/"
