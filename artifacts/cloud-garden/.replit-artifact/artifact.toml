kind = "mobile"
previewPath = "/"
title = "Slice & Bloom"
description = "A one-touch Matter.js physics puzzle with 465 stages across five independent modes: 100 Campaign beds including Infinity Cascade, 100 Hardcore levels, 100 Genesis Gauntlet masterclass challenges, 110 Void Protocol levels, and 55 Singularity Paradox puzzles. Genesis features angle-correct reflected lasers, physical counterweight chains, and split-droplet challenges requiring both buds to bloom. Responsive chapter browsing, separate personal stars/scores/best times, preserved progress, and instant tap/R retry support every mode."
version = "1.0.0"
id = "artifacts/cloud-garden"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24065

[services.development]
run = "pnpm --filter @workspace/cloud-garden run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cloud-garden", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cloud-garden", "run", "serve" ]

[services.env]
PORT = "24065"
BASE_PATH = "/"
